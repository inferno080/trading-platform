# SonarCloud settings. The project key and organization match the project on sonarcloud.io.
sonar.projectKey=inferno080_trading-platform
sonar.organization=inferno080
sonar.projectName=trading-platform
sonar.sourceEncoding=UTF-8

# What to analyse. The backend is analysed for code quality but has no automated tests (see README).
sonar.sources=backend/src,backend/scripts,frontend/src
sonar.tests=frontend/cypress
sonar.test.inclusions=frontend/cypress/**/*.cy.ts,frontend/cypress/**/*.cy.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,frontend/src/main.tsx

# Coverage comes from the frontend component tests only, so the backend must not count against it.
sonar.coverage.exclusions=backend/**
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
