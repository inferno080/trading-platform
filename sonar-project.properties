# SonarCloud settings. The project key and organization match the project on sonarcloud.io.
sonar.projectKey=inferno080_trading-platform
sonar.organization=inferno080
sonar.projectName=trading-platform
sonar.sourceEncoding=UTF-8

# SonarCloud analyses the whole project by default, so only exclusions are listed here.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,frontend/src/main.tsx

# Code that is not measured for test coverage (it is still analysed for bugs, vulnerabilities and code smells):
# - the backend, which has no automated tests by design
# - the Cypress tests themselves and their helpers
# - build and tool configuration files
# - the Web Worker entry file, which runs on another thread and cannot report coverage (its logic is in FeedConnection)
sonar.coverage.exclusions=backend/**,frontend/cypress/**,frontend/*.config.ts,frontend/*.config.js,frontend/src/feed/feedWorker.ts
# Coverage report from the frontend component tests (paths are made relative to the repository root in CI).
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
