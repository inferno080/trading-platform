name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (typecheck, lint, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  component-tests:
    name: Component tests and coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run component tests with coverage
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6.10.9
        with:
          working-directory: frontend
          component: true
        env:
          VITE_COVERAGE: "true"
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
      - name: Keep screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

  e2e:
    name: End-to-end tests and accessibility scan
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Start the backend with a light feed
        working-directory: backend
        env:
          # Few instruments and a low rate keep the page responsive on a shared CI machine.
          INSTRUMENTS: "200"
          UPDATES_PER_SEC: "500"
        run: |
          npm ci --ignore-scripts
          nohup npm start > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null; then echo "backend is up"; exit 0; fi
            sleep 1
          done
          echo "The backend did not start in 30 seconds:"; cat backend.log; exit 1
      - name: Build and start the app (production build)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx cypress install
          npm run build
          nohup npm run preview -- --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:4173/; then echo "app is up"; exit 0; fi
            sleep 1
          done
          echo "The app did not start in 30 seconds:"; cat preview.log; exit 1
      - name: Run end-to-end tests
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6.10.9
        with:
          working-directory: frontend
          install: false # dependencies and the Cypress binary were installed above
      - name: Keep screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore
      - name: Show the server logs if something failed
        if: failure()
        run: |
          echo "--- backend"; cat backend/backend.log || true
          echo "--- app"; cat frontend/preview.log || true

  quality:
    name: Code quality (SonarCloud)
    needs: [component-tests]
    runs-on: ubuntu-latest
    # Pull requests from forks cannot read repository secrets, so the scan only runs for this repository's branches.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud needs full history to attribute new code
      - name: Get the coverage report
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Make coverage file paths relative to the repository root
        run: sed -i 's|^SF:|SF:frontend/|' frontend/coverage/lcov.info
      - name: SonarCloud scan and quality gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          args: -Dsonar.qualitygate.wait=true
      - name: Explain why the scan was skipped
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not set, so the SonarCloud scan was skipped. See the README, section 'Code quality gate'."
